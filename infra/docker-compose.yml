services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: nx_postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: dev_db
    volumes:
      - postgres_/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nx_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --requirepass dev_redis_password
    volumes:
      - redis_/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: nx_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@domain.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres

  minio:
    image: minio/minio:latest
    container_name: nx_minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # MinIO Console
    environment:
      MINIO_ROOT_USER: dev_minio_admin
      MINIO_ROOT_PASSWORD: dev_minio_password
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    # Added a healthcheck so the init container knows exactly when it's ready
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: nx_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 dev_minio_admin dev_minio_password;
      mc mb myminio/carbuncle-assets --ignore-existing;
      mc anonymous set download myminio/carbuncle-assets;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data: